<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Qisma mark: one bar split into segments; the last (accent) is the remainder. -->
  <rect width="512" height="512" fill="#0f1113"/>
  <clipPath id="bar"><rect x="96" y="208" width="320" height="96" rx="48"/></clipPath>
  <!-- Mirrored like the app: in RTL the bar fills from the right and the remainder ends on the left. -->
  <g clip-path="url(#bar)" transform="translate(512 0) scale(-1 1)">
    <rect x="96" y="208" width="320" height="96" fill="#34c6a4"/>
    <rect x="96" y="208" width="60" height="96" fill="#7fa6d6"/>
    <rect x="162" y="208" width="48" height="96" fill="#d9ae5f"/>
    <rect x="216" y="208" width="36" height="96" fill="#b58cc8"/>
    <rect x="156" y="208" width="6" height="96" fill="#0f1113"/>
    <rect x="210" y="208" width="6" height="96" fill="#0f1113"/>
    <rect x="252" y="208" width="6" height="96" fill="#0f1113"/>
  </g>
</svg>
